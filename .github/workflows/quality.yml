name: Quality and supply chain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Provision pinned Python
        run: uv python install --no-bin
      - name: Provision decoder host controls
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libseccomp2
          # The ephemeral runner must permit the fixed unprivileged namespace
          # launcher. Worker restrictions remain enforced and probed in tests.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run local quality, packaging and audit gates
        run: bash scripts/check.sh
      - name: Prove failure detection with disposable negative controls
        run: uv run --locked --no-sync python scripts/check_negative.py
