[project]
name = "scryntic"
version = "0.1.0.dev0"
description = "Linux crypto market intelligence platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12.14,<3.13"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[dependency-groups]
# Add dependencies only when their implementation task is approved.
collector = ["pyarrow==25.0.1"]
analysis = []
dev = [
    "mypy==2.3.1",
    "packaging==26.3",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.13"
default-groups = []
python-preference = "only-managed"
python-downloads = "manual"

[tool.uv.build-backend]
source-include = [".python-version", "uv.lock", "build-constraints.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
warn_unused_configs = true
